[package]
name = "lyonix-lab"
version = "0.2.0"
description = "Small, cross-platform local LLM runtime and model manager"
authors = ["LYONIX-LAB"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "lyonix_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.5"

[dependencies]
lyonix-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
